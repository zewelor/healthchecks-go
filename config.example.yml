# Generate a random UUID on Linux: cat /proc/sys/kernel/random/uuid
# Keep an existing UUID when migrating a check to preserve its ping URL.
# Without uuid, name + HC_UUID_SEED (32+ bytes) determine the UUID; keep both stable.
public_url: http://localhost:8000

checks:
  - uuid: 11111111-1111-4111-8111-111111111111
    name: Heartbeat
    every: 5m
    grace: 1m

  - name: Daily backup
    cron: "0 2 * * *"
    timezone: Europe/London
    grace: 30m
