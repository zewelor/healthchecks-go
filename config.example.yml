# Generate a random UUID on Linux: cat /proc/sys/kernel/random/uuid
# Keep an existing UUID when migrating a check to preserve its ping URL.
public_url: http://localhost:8000

checks:
  - uuid: 11111111-1111-4111-8111-111111111111
    name: Heartbeat
    every: 5m
    grace: 1m

  - uuid: 22222222-2222-4222-8222-222222222222
    name: Daily backup
    description: Encrypted database backup. Verify the archive before reporting success.
    cron: "0 2 * * *"
    timezone: Europe/London
    grace: 30m
